<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cinema Deck</title>
    
    <!-- PWA Configurations so your phone installs it natively -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#141414">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Netflix-style Sidebar */
        .sidebar {
            width: 240px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #222;
            z-index: 10;
        }

        .logo {
            color: #E50914;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .menu-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .nav-item {
            padding: 12px 15px;
            color: #b3b3b3;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background-color: #222222;
        }

        .nav-item.active {
            border-left: 4px solid #E50914;
            padding-left: 11px;
        }

        /* Main Content Viewport */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #141414;
            overflow-y: auto;
            position: relative;
        }

        /* Fixed Video Player Frame */
        .player-container {
            width: 100%;
            background-color: #000000;
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Dashboard Info & Grid */
        .content-details {
            padding: 25px;
        }

        .series-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .series-desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
            max-width: 800px;
            line-height: 1.5;
        }

        .section-heading {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Episode Grid Layout */
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .episode-card {
            background-color: #181818;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            border: 1px solid #252525;
        }

        .episode-card:hover {
            transform: scale(1.03);
            background-color: #282828;
        }

        .episode-card.playing {
            border: 2px solid #E50914;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #222;
        }

        .thumb-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px;
        }

        .ep-number {
            font-size: 12px;
            color: #E50914;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .ep-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Mobile Optimization Rules */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px 15px;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid #222;
            }
            .logo {
                margin-bottom: 0;
                margin-right: 20px;
                font-size: 18px;
            }
            .menu-label {
                display: none;
            }
            .nav-item {
                margin-bottom: 0;
                margin-right: 8px;
                white-space: nowrap;
                padding: 8px 12px;
                font-size: 13px;
            }
            .nav-item.active {
                border-left: none;
                border-bottom: 3px solid #E50914;
                padding-left: 12px;
                border-radius: 0;
            }
            .content-details {
                padding: 15px;
            }
            .series-title {
                font-size: 22px;
            }
            .episode-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
            .ep-title {
                font-size: 12px;
            }
        }
    </style>
</head>
