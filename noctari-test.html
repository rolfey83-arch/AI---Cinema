
<script>
(() => {
  "use strict";

  const API = "https://www.googleapis.com/youtube/v3";
  const MAX_UPLOAD_PAGES = 20;
  const $ = id => document.getElementById(id);

  function setStatus(message) {
    $("status").textContent = message;
  }

  function getPlaylistId(value) {
    try {
      const url = new URL(value.trim());
      return url.searchParams.get("list") || "";
    } catch {
      return "";
    }
  }

  async function apiRequest(endpoint, params, key) {
    const url = new URL(API + "/" + endpoint);

    Object.entries({ ...params, key }).forEach(([name, value]) => {
      if (value !== undefined && value !== "") {
        url.searchParams.set(name, value);
      }
    });

    const response = await fetch(url);

    if (!response.ok) {
      let detail = "";
      try {
        const data = await response.json();
        detail = data.error?.message || "";
      } catch {}

      throw new Error(
        "YouTube API returned HTTP " + response.status +
        (detail ? ": " + detail : "")
      );
    }

    return response.json();
  }

  async function findChannel(handle, key) {
    const cleanHandle = handle.trim().replace(/^@/, "");

    const data = await apiRequest("channels", {
      part: "snippet,contentDetails",
      forHandle: cleanHandle
    }, key);

    if (!data.items?.length) {
      throw new Error("YouTube could not find that channel handle.");
    }

    return data.items[0];
  }

  async function scanPlaylist(playlistId, key, progress) {
    const videos = [];
    let pageToken = "";

    do {
      const data = await apiRequest("playlistItems", {
        part: "snippet,contentDetails",
        playlistId,
        maxResults: 50,
        pageToken
      }, key);

      for (const item of data.items || []) {
        const videoId =
          item.contentDetails?.videoId ||
          item.snippet?.resourceId?.videoId;

        if (!videoId) continue;

        videos.push({
          id: videoId,
          title: item.snippet?.title || "Untitled",
          date: item.contentDetails?.videoPublishedAt ||
                item.snippet?.publishedAt || ""
        });
      }

      pageToken = data.nextPageToken || "";

      if (progress) progress(videos.length);

    } while (pageToken);

    return videos;
  }

  function episodeNumber(title) {
    const patterns = [
      /\bNOCTARI\s*(?:[-–:]?\s*)?(?:PART|EPISODE|EP)?\s*([1-9]\d*)\b/i,
      /\b(?:PART|EPISODE|EP)\s*#?\s*([1-9]\d*)\b/i
    ];

    for (const pattern of patterns) {
      const match = title.match(pattern);
      if (match) return Number(match[1]);
    }

    if (/NOCTARI/i.test(title) && /\bARRIVAL\b/i.test(title)) {
      return 1;
    }

    return null;
  }

  function parseDuration(value) {
    if (!value) return null;

    const match = value.match(
      /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/
    );

    if (!match) return null;

    return (
      Number(match[1] || 0) * 3600 +
      Number(match[2] || 0) * 60 +
      Number(match[3] || 0)
    );
  }

  function formatDuration(seconds) {
    if (seconds === null || seconds === undefined) {
      return "Duration unavailable";
    }

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    if (hours) {
      return hours + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");
    }

    return minutes + ":" + String(secs).padStart(2, "0");
  }

  async function addVideoDurations(videos, key) {
    const durationMap = new Map();

    // YouTube accepts up to 50 video IDs per request.
    for (let i = 0; i < videos.length; i += 50) {
      const batch = videos.slice(i, i + 50);
      const ids = batch.map(video => video.id).join(",");

      const data = await apiRequest("videos", {
        part: "contentDetails",
        id: ids
      }, key);

      for (const item of data.items || []) {
        durationMap.set(
          item.id,
          parseDuration(item.contentDetails?.duration)
        );
      }
    }

    return videos.map(video => ({
      ...video,
      duration: durationMap.get(video.id) ?? null
    }));
  }

  function sortVideos(videos) {
    return videos.sort((a, b) => {
      const aNumber = episodeNumber(a.title);
      const bNumber = episodeNumber(b.title);

      if (aNumber !== null && bNumber !== null) {
        return aNumber - bNumber;
      }

      if (aNumber !== null) return -1;
      if (bNumber !== null) return 1;

      return new Date(a.date || 0) -
             new Date(b.date || 0);
    });
  }

  function renderGroup(results, heading, description, videos, type) {
    if (!videos.length) return;

    const title = document.createElement("h2");
    title.textContent = heading + " (" + videos.length + ")";
    results.appendChild(title);

    const explanation = document.createElement("p");
    explanation.textContent = description;
    results.appendChild(explanation);

    videos.forEach(video => {
      const card = document.createElement("article");
      card.className = "episode";

      const image = document.createElement("img");
      image.loading = "lazy";
      image.alt = "";
      image.src =
        "https://i.ytimg.com/vi/" +
        encodeURIComponent(video.id) +
        "/mqdefault.jpg";

      const details = document.createElement("div");

      const link = document.createElement("a");
      link.href =
        "https://www.youtube.com/watch?v=" +
        encodeURIComponent(video.id);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = video.title;

      const meta = document.createElement("div");
      meta.className = "meta";

      const number = episodeNumber(video.title);
      const dateText = video.date
        ? " · " + new Date(video.date).toLocaleDateString()
        : "";

      let label;

      if (type === "short") {
        label = "Short-form candidate";
        if (number !== null) {
          label += " · Related to Episode " + number;
        }
      } else {
        label = number !== null
          ? "Episode " + number
          : "Episode number not recognised";
      }

      meta.textContent =
        label + " · " +
        formatDuration(video.duration) +
        dateText;

      details.append(link, meta);
      card.append(image, details);
      results.appendChild(card);
    });
  }

  function renderEpisodes(episodes, shorts, unknown) {
    const results = $("results");
    results.replaceChildren();

    if (!episodes.length && !shorts.length && !unknown.length) {
      const message = document.createElement("p");
      message.textContent = "No matching NOCTARI videos were found.";
      results.appendChild(message);
      return;
    }

    renderGroup(
      results,
      "Full episodes",
      "Longer NOCTARI videos, ordered by episode number.",
      episodes,
      "episode"
    );

    renderGroup(
      results,
      "Shorts / short-form candidates",
      "Videos classified by duration. Some may need manual checking.",
      shorts,
      "short"
    );

    renderGroup(
      results,
      "Needs checking",
      "Videos for which YouTube did not return a usable duration.",
      unknown,
      "unknown"
    );
  }

  async function runScan() {
    const key = $("apiKey").value.trim();
    const handle = $("handle").value.trim();
    const button = $("scanButton");

    if (!key) {
      setStatus("Please enter a YouTube Data API key first.");
      $("apiKey").focus();
      return;
    }

    if (!handle) {
      setStatus("Please enter the creator's YouTube handle.");
      return;
    }

    button.disabled = true;
    $("results").replaceChildren();

    try {
      setStatus("Finding the creator's channel…");

      const channel = await findChannel(handle, key);

      const uploadsId =
        channel.contentDetails?.relatedPlaylists?.uploads;

      if (!uploadsId) {
        throw new Error("Could not find the channel's uploads playlist.");
      }

      setStatus("Scanning channel uploads…");

      const uploads = [];
      let pageToken = "";

      for (let page = 0; page < MAX_UPLOAD_PAGES; page++) {
        const data = await apiRequest("playlistItems", {
          part: "snippet,contentDetails",
          playlistId: uploadsId,
          maxResults: 50,
          pageToken
        }, key);

        for (const item of data.items || []) {
          const id =
            item.contentDetails?.videoId ||
            item.snippet?.resourceId?.videoId;

          if (!id) continue;

          uploads.push({
            id,
            title: item.snippet?.title || "Untitled",
            date: item.contentDetails?.videoPublishedAt ||
                  item.snippet?.publishedAt || ""
          });
        }

        setStatus("Scanned " + uploads.length + " channel uploads…");

        pageToken = data.nextPageToken || "";
        if (!pageToken) break;
      }

      const playlistInput = $("playlists").value.trim();

      const playlistIds = playlistInput
        ? playlistInput.split(",")
            .map(getPlaylistId)
            .filter(Boolean)
        : [];

      const allVideos = [...uploads];

      for (const playlistId of playlistIds) {
        setStatus("Scanning an additional playlist…");

        const playlistVideos =
          await scanPlaylist(playlistId, key);

        allVideos.push(...playlistVideos);
      }

      // Remove duplicate videos using their unique YouTube IDs.
      const unique = new Map();

      for (const video of allVideos) {
        if (!unique.has(video.id)) {
          unique.set(video.id, video);
        }
      }

      // Keep NOCTARI videos only.
      const noctari = [...unique.values()]
        .filter(video => /NOCTARI/i.test(video.title));

      setStatus(
        "Checking the duration of " +
        noctari.length + " NOCTARI videos…"
      );

      // Retrieve actual video durations from YouTube.
      const detailed = await addVideoDurations(noctari, key);

      const episodes = [];
      const shorts = [];
      const unknown = [];

      const cutoff = new Date("2024-10-15T00:00:00Z");

      for (const video of detailed) {
        if (video.duration === null) {
          unknown.push(video);
          continue;
        }

        const published = new Date(video.date);
        const olderVideo = !video.date || published < cutoff;

        // Older Shorts had a 60-second limit.
        // Newer qualifying Shorts can be up to 3 minutes.
        const shortLimit = olderVideo ? 60 : 180;

        if (video.duration <= shortLimit) {
          shorts.push(video);
        } else {
          episodes.push(video);
        }
      }

      sortVideos(episodes);
      sortVideos(shorts);
      sortVideos(unknown);

      renderEpisodes(episodes, shorts, unknown);

      const total = episodes.length + shorts.length + unknown.length;

      $("resultHeading").textContent =
        "Discovered NOCTARI videos (" + total + ")";

      setStatus(
        "Scan complete. " + uploads.length +
        " uploads checked. " + episodes.length +
        " longer videos; " + shorts.length +
        " short-form candidates; " + unknown.length +
        " needing review."
      );

    } catch (error) {
      console.error(error);
      setStatus("Scan failed: " + error.message);
    } finally {
      button.disabled = false;
    }
  }

  $("scanButton").addEventListener("click", runScan);

})();
</script>
