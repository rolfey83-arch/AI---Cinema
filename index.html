<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cinema Deck</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#141414">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #141414; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: #000000; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; z-index: 10; justify-content: space-between; }
        .logo { color: #E50914; font-size: 22px; font-weight: bold; letter-spacing: 1px; margin-bottom: 25px; text-transform: uppercase; }
        .menu-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; margin-top: 15px; }
        .nav-container { flex: 1; overflow-y: auto; }
        .nav-item { padding: 12px 15px; color: #b3b3b3; text-decoration: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .nav-item:hover, .nav-item.active { color: #ffffff; background-color: #222222; }
        .nav-item.active { border-left: 4px solid #E50914; padding-left: 11px; }
        .delete-btn { color: #555; font-size: 12px; cursor: pointer; padding: 2px 6px; }
        .delete-btn:hover { color: #E50914; }
        .add-btn { background-color: #222; color: #fff; border: 1px dashed #444; padding: 12px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 15px; transition: background-color 0.2s; }
        .add-btn:hover { background-color: #E50914; border-color: #E50914; }
        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #141414; overflow-y: auto; position: relative; }
        .player-container { width: 100%; background-color: #000000; position: relative; padding-top: 56.25%; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .content-details { padding: 25px; }
        .series-title { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .series-desc { font-size: 14px; color: #aaa; margin-bottom: 25px; max-width: 800px; line-height: 1.5; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .episode-card { background-color: #181818; border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid #252525; transition: transform 0.2s ease; }
        .episode-card:hover { transform: scale(1.03); background-color: #282828; }
        .episode-card.playing { border: 2px solid #E50914; }
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background-color: #222; }
        .thumb-wrapper img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-details { padding: 12px; }
        .ep-title { font-size: 14px; font-weight: bold; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        .loading-text { color: #666; font-style: italic; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #181818; border: 1px solid #333; padding: 30px; border-radius: 8px; width: 90%; max-width: 450px; }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-content input { width: 100%; padding: 12px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-cancel { background: #333; color: #aaa; }
        .btn-save { background: #E50914; color: #fff; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 10px 15px; border-right: none; border-bottom: 1px solid #222; }
            .logo { margin-bottom: 0; margin-right: 15px; font-size: 18px; }
            .nav-container { display: flex; flex-direction: row; overflow-x: auto; align-items: center; width: 100%; }
            .menu-label { display: none; }
            .nav-item { margin-bottom: 0; margin-right: 8px; white-space: nowrap; padding: 8px 12px; font-size: 13px; }
            .nav-item.active { border-left: none; border-bottom: 3px solid #E50914; padding-left: 12px; border-radius: 0; }
            .delete-btn { margin-left: 6px; }
            .add-btn { margin-top: 0; margin-left: 8px; padding: 8px 12px; white-space: nowrap; }
            .content-details { padding: 15px; }
            .episode-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">AI Cinema</div>
            <div class="menu-label">My Channels</div>
            <div class="nav-container" id="sidebarNav"></div>
        </div>
        <div class="add-btn" onclick="openModal()">➕ Add New Series</div>
    </div>

    <div class="main-content">
        <div class="player-container">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="content-details">
            <h1 class="series-title" id="seriesTitle">Loading...</h1>
            <p class="series-desc" id="seriesDesc"></p>
            <h2 class="section-heading">Episodes</h2>
            <div class="episode-grid" id="episodeGrid"></div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>Track New AI Channel</h3>
            <input type="text" id="inputTitle" placeholder="Series Name">
            <input type="text" id="inputChannelId" placeholder="YouTube Channel ID">
            <input type="text" id="inputDesc" placeholder="Brief Description (Optional)">
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveNewChannel()">Add to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        const defaultChannels = [
            { id: "quantum", title: "Quantum 13", feed: "UCqE1zZ9E9E2xGjCg64G-LgA", desc: "Produced by Somex Studios. Tech-organic machine survival." },
            { id: "oz", title: "The Wizard of Oz", feed: "UCtHlZzW2T7x_S0c1p3vH3yQ", desc: "Produced by 451º. Gritty dark fantasy adaptation." }
        ];

        let userChannels = JSON.parse(localStorage.getItem('ai_cinema_channels')) || defaultChannels;
        let currentActiveId = userChannels[0]?.id || '';

        function renderSidebar() {
            const container = document.getElementById('sidebarNav');
            container.innerHTML = '';
            
            userChannels.forEach(ch => {
                const item = document.createElement('div');
                item.className = `nav-item ${ch.id === currentActiveId ? 'active' : ''}`;
                item.setAttribute('onclick', `switchSeries('${ch.id}', this)`);
                item.innerHTML = `
                    <span>${ch.title}</span>
                    <span class="delete-btn" onclick="deleteChannel('${ch.id}', event)">✕</span>
                `;
                container.appendChild(item);
            });
        }

        function extractVideoId(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.searchParams.get('v');
            } catch (e) {
                // Fallback if URL parsing fails completely
                const match = url.match(/[?&]v=([^&#]+)/);
                return match ? match[1] : null;
            }
        }

        async function fetchChannelVideos(channelId) {
            const grid = document.getElementById('episodeGrid');
            grid.innerHTML = '<p class="loading-text">Scanning studio satellites...</p>';
            
            const config = userChannels.find(ch => ch.id === channelId);
            if (!config) return;

            document.getElementById('seriesTitle').innerText = config.title;
            document.getElementById('seriesDesc').innerText = config.desc || '';

            try {
                const response = await fetch(`https://rss2json.com{config.feed}`);
                const data = await response.json();
                grid.innerHTML = '';

                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    let firstVideoId = '';
                    data.items.forEach((item, index) => {
                        const videoId = extractVideoId(item.link);
                        if (!videoId) return;
                        
                        if (index === 0) firstVideoId = videoId;

                        const card = document.createElement('div');
                        card.className = `episode-card ${index === 0 ? 'playing' : ''}`;
                        card.onclick = () => playVideo(videoId, card);
                        
                        card.innerHTML = `
